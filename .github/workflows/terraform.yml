name: "Terraform Infrastructure CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# CRITICAL: These permissions are required for the OIDC handshake to work
permissions:
  id-token: write
  contents: read
  pull-requests: write # Required to post comments on PRs

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    # We define environment variables for Terraform
    env:
      TF_IN_AUTOMATION: true
      AWS_REGION: "us-east-1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::930699228260:role/GitHubActionsTerraformRole # <-- PASTE YOUR ROLE ARN HERE
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0" # Use your current version

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color
        continue-on-error: true

      # This step is the "DevOps Magic". It automatically comments the TF Plan on your PR!
      - name: Add Plan Comment to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status Check
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        # ONLY run apply if we are pushing/merging into the main branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
        run: terraform apply -auto-approve

      # Trigger Amplify after infrastructure is fully deployed
      - name: Trigger Amplify Frontend Build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          APP_ID=$(terraform output -raw amplify_app_id)
          aws amplify start-job \
            --app-id $APP_ID \
            --branch-name main \
            --job-type RELEASE
